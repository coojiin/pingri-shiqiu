<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>點餐｜平日食器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#f4f0e8; --ink:#2a2622; --soft:#6e655c; --sage:#7a9084; --sage-d:#5f7569;
    --line:#cfc4b4; --white:#fbf8f2; --seal:#b86a5c; --takeout:#c47a4e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;padding-bottom:88px}
  header{
    position:sticky;top:0;z-index:20;background:rgba(244,240,232,.95);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .logo{height:36px;width:auto;max-width:55vw;object-fit:contain}
  .table-pill{
    font-size:13px;letter-spacing:.08em;background:var(--sage);color:#fff;padding:6px 12px;white-space:nowrap;
  }
  .table-pill.takeout{background:var(--takeout)}
  .wrap{padding:16px;max-width:560px;margin:0 auto}
  .hint{font-size:13px;color:var(--soft);margin-bottom:14px}
  .cat{font-family:"Noto Serif TC",serif;font-size:14px;letter-spacing:.18em;color:var(--sage-d);margin:18px 0 8px}
  .item{
    display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
    background:var(--white);border:1px solid var(--line);padding:12px 14px;margin-bottom:8px;
  }
  .name{font-family:"Noto Serif TC",serif;font-size:16px;letter-spacing:.06em}
  .sub{font-size:12px;color:var(--soft);margin-top:2px}
  .price{font-size:14px;color:var(--seal);margin-top:4px}
  .qty{display:flex;align-items:center;gap:8px}
  .qty button{
    width:32px;height:32px;border:1px solid var(--sage);background:#fff;color:var(--sage-d);font-size:18px;line-height:1;cursor:pointer;
  }
  .qty span{min-width:1.2em;text-align:center;font-weight:600}
  .cart-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:var(--ink);color:#fbf8f2;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;
  }
  .cart-bar button,.panel button.primary{
    background:var(--sage);color:#fff;border:none;padding:12px 18px;font-size:14px;letter-spacing:.1em;cursor:pointer;
  }
  body.takeout .cart-bar button,.panel button.primary.takeout-btn{background:var(--takeout)}
  .panel{
    display:none;position:fixed;inset:0;z-index:40;background:rgba(42,38,34,.45);padding:24px 16px 16px;
  }
  .panel.open{display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--bg);width:min(560px,100%);max-height:85vh;overflow:auto;padding:20px 16px 24px;border:1px solid var(--line)}
  .sheet h2{font-family:"Noto Serif TC",serif;font-size:18px;letter-spacing:.1em;margin-bottom:12px}
  .row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dotted var(--line);font-size:14px}
  textarea,input[type=text]{
    width:100%;margin-top:10px;padding:10px;border:1px solid var(--line);background:var(--white);font:inherit;resize:vertical;
  }
  .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .actions button{flex:1;min-width:120px;padding:12px;border:1px solid var(--line);background:var(--white);cursor:pointer}
  .actions .primary{background:var(--sage);color:#fff;border-color:var(--sage)}
  .ok{padding:20px;text-align:center}
  .ok h2{margin-bottom:8px}
  .pickup{
    font-family:"Noto Serif TC",serif;font-size:42px;letter-spacing:.12em;color:var(--takeout);
    margin:12px 0;padding:12px;border:2px dashed var(--takeout);
  }
  .ghost{font-size:13px;color:var(--sage-d);margin-top:16px;text-align:center}
</style>
</head>
<body>
<header>
  <img class="logo" src="../brand/logo-heng-rice-noodle.png" alt="平日食器" />
  <div class="table-pill" id="tablePill">桌號 —</div>
</header>
<div class="wrap">
  <p class="hint" id="hint">選好餐點後送出，廚房會收到。結帳請到櫃檯。</p>
  <div id="menu"></div>
  <p class="ghost" id="callWrap"><button id="callBtn" type="button" style="all:unset;cursor:pointer;color:var(--sage-d);border-bottom:1px solid var(--sage)">餐畢叫店員</button></p>
</div>

<div class="cart-bar" id="cartBar">
  <div><span id="cartCount">0</span> 項 · $<span id="cartTotal">0</span></div>
  <button type="button" id="openCart">看購物車</button>
</div>

<div class="panel" id="panel">
  <div class="sheet" id="sheet"></div>
</div>

<script src="menu-data.js"></script>
<script>
const params = new URLSearchParams(location.search);
const modeParam = (params.get("mode") || "").toLowerCase();
const tableParam = (params.get("table") || "").toLowerCase();
const isTakeout = modeParam === "takeout" || tableParam === "takeout";
const table = isTakeout ? null : Math.max(1, parseInt(params.get("table") || "1", 10) || 1);

const pill = document.getElementById("tablePill");
if (isTakeout) {
  document.body.classList.add("takeout");
  document.title = "外帶點餐｜平日食器";
  pill.textContent = "外帶";
  pill.classList.add("takeout");
  document.getElementById("hint").textContent = "外帶點餐：選好後送出會得到取餐代號，到櫃檯結帳取餐。";
  document.getElementById("callWrap").style.display = "none";
} else {
  pill.textContent = "桌 " + table;
}

const cart = new Map();

function renderMenu() {
  const root = document.getElementById("menu");
  const cats = [...new Set(PINGRI_MENU.map(i => i.cat))];
  root.innerHTML = cats.map(cat => {
    const items = PINGRI_MENU.filter(i => i.cat === cat).map(i => {
      const q = cart.get(i.id) || 0;
      return `<div class="item" data-id="${i.id}">
        <div><div class="name">${i.name}</div><div class="sub">${i.sub}</div><div class="price">$${i.price}</div></div>
        <div class="qty">
          <button type="button" data-act="-" aria-label="減少">−</button>
          <span>${q}</span>
          <button type="button" data-act="+" aria-label="增加">＋</button>
        </div>
      </div>`;
    }).join("");
    return `<div class="cat">${cat}</div>${items}`;
  }).join("");
}

function totals() {
  let count = 0, total = 0;
  for (const [id, qty] of cart) {
    const item = PINGRI_MENU.find(i => i.id === id);
    if (!item || !qty) continue;
    count += qty; total += item.price * qty;
  }
  return { count, total };
}

function refreshBar() {
  const { count, total } = totals();
  document.getElementById("cartCount").textContent = count;
  document.getElementById("cartTotal").textContent = total;
}

document.getElementById("menu").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const itemEl = btn.closest(".item");
  const id = itemEl.dataset.id;
  let q = cart.get(id) || 0;
  q = btn.dataset.act === "+" ? q + 1 : Math.max(0, q - 1);
  if (q === 0) cart.delete(id); else cart.set(id, q);
  renderMenu();
  refreshBar();
});

function openPanel(html) {
  document.getElementById("sheet").innerHTML = html;
  document.getElementById("panel").classList.add("open");
}
function closePanel() { document.getElementById("panel").classList.remove("open"); }
document.getElementById("panel").addEventListener("click", (e) => { if (e.target.id === "panel") closePanel(); });

document.getElementById("openCart").onclick = () => {
  const { count, total } = totals();
  if (!count) {
    openPanel(`<h2>購物車是空的</h2><p class="hint">先選幾樣再送出。</p><div class="actions"><button type="button" id="closeP">關閉</button></div>`);
    bindClose(); return;
  }
  const rows = [...cart.entries()].map(([id, qty]) => {
    const i = PINGRI_MENU.find(x => x.id === id);
    return `<div class="row"><span>${i.name} × ${qty}</span><span>$${i.price * qty}</span></div>`;
  }).join("");
  const title = isTakeout ? "外帶 · 購物車" : `桌 ${table} · 購物車`;
  const noteLabel = isTakeout ? "取餐備註（預計何時取、少冰等）" : "整單備註（少冰、過敏等）";
  const notePh = isTakeout ? "例：約 12:20 取餐" : "選填";
  openPanel(`
    <h2>${title}</h2>
    ${rows}
    <div class="row" style="font-weight:600;border:none;margin-top:8px"><span>合計</span><span>$${total}</span></div>
    <label class="hint" style="display:block;margin-top:12px">${noteLabel}</label>
    <textarea id="note" rows="2" placeholder="${notePh}"></textarea>
    <div class="actions">
      <button type="button" id="closeP">繼續選</button>
      <button type="button" class="primary${isTakeout ? " takeout-btn" : ""}" id="submitOrder">送出訂單</button>
    </div>
  `);
  bindClose();
  document.getElementById("submitOrder").onclick = submitOrder;
};

function bindClose() {
  const b = document.getElementById("closeP");
  if (b) b.onclick = closePanel;
}

function submitOrder() {
  const { count, total } = totals();
  if (!count) return;
  const note = (document.getElementById("note")?.value || "").trim();
  const items = [...cart.entries()].map(([id, qty]) => {
    const i = PINGRI_MENU.find(x => x.id === id);
    return { id, name: i.name, sub: i.sub, price: i.price, qty };
  });
  const pickupCode = isTakeout ? PingriOrders.nextTakeoutCode() : null;
  const order = {
    id: "O" + Date.now().toString(36).toUpperCase(),
    mode: isTakeout ? "takeout" : "dinein",
    table: isTakeout ? null : table,
    pickupCode,
    items,
    note,
    total,
    status: "pending",
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
  PingriOrders.add(order);
  cart.clear();
  renderMenu();
  refreshBar();
  if (isTakeout) {
    openPanel(`
      <div class="ok">
        <h2>外帶已送出</h2>
        <p>請記住取餐代號</p>
        <div class="pickup">${pickupCode}</div>
        <p class="hint">合計 $${total}<br/>到櫃檯出示取餐號結帳取餐。</p>
        ${note ? `<p class="hint">備註：${note}</p>` : ""}
        <div class="actions"><button type="button" class="primary takeout-btn" id="closeP">好</button></div>
      </div>
    `);
  } else {
    openPanel(`
      <div class="ok">
        <h2>已送出</h2>
        <p>單號 ${order.id}<br/>桌 ${table} · $${total}</p>
        <p class="hint" style="margin-top:10px">廚房已收到。結帳請到櫃檯。</p>
        <div class="actions"><button type="button" class="primary" id="closeP">好</button></div>
      </div>
    `);
  }
  bindClose();
}

const callBtn = document.getElementById("callBtn");
if (callBtn) callBtn.onclick = () => {
  if (isTakeout) return;
  PingriOrders.add({
    id: "C" + Date.now().toString(36).toUpperCase(),
    mode: "dinein",
    table,
    items: [],
    note: "餐畢叫店員",
    total: 0,
    status: "call",
    createdAt: Date.now(),
    updatedAt: Date.now()
  });
  openPanel(`<div class="ok"><h2>已通知店員</h2><p class="hint">請稍候，店員會過來。</p><div class="actions"><button type="button" class="primary" id="closeP">好</button></div></div>`);
  bindClose();
};

renderMenu();
refreshBar();
</script>
</body>
</html>
