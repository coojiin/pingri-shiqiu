<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>點餐｜平日食器</title>
<style>
  body{font-family:system-ui,"Noto Sans TC",sans-serif;background:#f4f0e8;color:#2a2622;line-height:1.65;margin:0;padding:48px 20px;text-align:center}
  h1{font-size:1.4rem;letter-spacing:.12em;font-weight:600;margin:0 0 16px}
  p{max-width:28em;margin:0 auto 12px;color:#6e655c;font-size:.95rem}
  .box{max-width:420px;margin:24px auto;padding:20px;background:#fbf8f2;border:1px solid #cfc4b4;text-align:left}
  code{background:#ebe4d8;padding:1px 6px;font-size:.85rem}
</style>
</head>
<body>
  <h1>平日食器點餐</h1>
  <div class="box" id="msg">
    <p><strong>請連上店內 Wi‑Fi 後，掃描桌上或櫃檯 QR。</strong></p>
    <p>點餐服務在店內區網運作；此公開頁僅為備援說明，無法直接點餐。</p>
    <p style="margin-top:16px;font-size:.85rem">外帶請至店內掃櫃檯 QR，勿使用舊版桌號／外帶連結。</p>
  </div>
  <script src="config.js"></script>
  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const cfg = window.PINGRI_ORDER || {};
    const apiBase = (cfg.apiBase || "").replace(/\/$/, "");
    const msg = document.getElementById("msg");

    if (params.has("table") && !params.get("t")) {
      msg.innerHTML = "<p><strong>請掃描桌上 QR（勿使用舊桌號連結）。</strong></p><p>舊的 <code>?table=</code> 連結已停用。</p>";
      return;
    }
    if ((params.get("mode") || "").toLowerCase() === "takeout" && !params.get("t")) {
      msg.innerHTML = "<p><strong>外帶請至店內掃櫃檯 QR。</strong></p><p>公開站不再提供無代碼的外帶入口。</p>";
      return;
    }

    // If apiBase configured (future cloud), redirect/load full client — for now stub only
    if (apiBase) {
      const t = (params.get("t") || "").trim();
      if (!t) {
        msg.innerHTML = "<p><strong>請掃描桌上或櫃檯 QR 進入點餐。</strong></p>";
        return;
      }
      msg.innerHTML = "<p>正在連線點餐服務…</p>";
      // Lightweight: send user to message that full menu needs LAN build;
      // When cloud ready, replace this file with full order client from API public/order.html
      fetch(apiBase + "/v1/resolve?t=" + encodeURIComponent(t))
        .then(r => r.json())
        .then(data => {
          if (data && data.ok) {
            msg.innerHTML = "<p>已驗證桌碼（" + (data.label || "") + "）。完整菜單客戶端部署中；請改用店內 QR（區網位址）點餐。</p>";
          } else {
            msg.innerHTML = "<p>QR 無效或已換新。請向店員索取最新桌貼。</p>";
          }
        })
        .catch(() => {
          msg.innerHTML = "<p><strong>請連店內 Wi‑Fi 後掃 QR。</strong></p><p>目前無法連到點餐後端（apiBase 未通）。</p>";
        });
      return;
    }

    if (params.get("t")) {
      msg.innerHTML = "<p><strong>請連上店內 Wi‑Fi 後，重新掃描桌上／櫃檯 QR。</strong></p><p>公開網頁尚未接上後端；店內 QR 會指向廚房電腦的區網位址。</p>";
    }
  })();
  </script>
</body>
</html>
