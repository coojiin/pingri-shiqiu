<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Landing v2 — 淡雅專業餐飲官網 -->
<link rel="icon" type="image/png" href="brand/favicon.png" />
<title>平日食器｜台式融合定食</title>
<meta name="description" id="metaDesc" content="平日快速的台式×日式新定食。家常味重新組裝。林口長庚／福樺水悅商圈。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f4f0e8;
    --paper-2: #ebe4d8;
    --sand: #d9cfc0;
    --sage: #7a9084;
    --sage-deep: #5f7569;
    --ink: #2a2622;
    --ink-soft: #6e655c;
    --clay: #c4a090;
    --seal: #b86a5c;
    --line: #cfc4b4;
    --white: #fbf8f2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Noto Sans TC", "Noto Sans JP", "Noto Sans KR", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.75;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 50;
    opacity: 0.18; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  a { color: inherit; text-decoration: none; }
  .wrap {
    width: min(1040px, 100%);
    margin: 0 auto;
    padding: 0 28px;
    position: relative;
    z-index: 1;
  }

  header.site {
    position: sticky; top: 0; z-index: 40;
    background: rgba(244, 240, 232, 0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid transparent;
  }
  header.site.on { border-bottom-color: var(--line); }
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    height: 76px; gap: 16px;
  }
  .nav-logo { height: 46px; width: auto; max-width: 280px; object-fit: contain; }
  .nav-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
  .nav-links {
    display: flex; gap: 22px; flex-wrap: wrap;
    font-size: 13px; font-weight: 400; letter-spacing: 0.12em; color: var(--ink-soft);
  }
  .nav-links a:hover { color: var(--sage-deep); }
  .nav-cta {
    font-size: 12px; letter-spacing: 0.14em;
    color: var(--sage-deep);
    border: 1px solid var(--sage);
    padding: 8px 14px;
  }
  .nav-cta:hover { background: var(--sage); color: var(--white); }
  .langs { display: flex; gap: 6px; flex-wrap: wrap; }
  .langs button {
    border: 1px solid var(--sand); background: var(--white);
    padding: 6px 10px; font: inherit; font-size: 12px;
    letter-spacing: 0.06em; cursor: pointer; color: var(--ink-soft);
  }
  .langs button.on {
    border-color: var(--sage); color: var(--sage-deep);
    background: rgba(122, 144, 132, 0.12);
  }

  .hero { padding: 48px 0 0; position: relative; z-index: 1; }
  .hero-grid {
    display: grid;
    grid-template-columns: 0.95fr 1.05fr;
    gap: 40px;
    align-items: center;
    padding-bottom: 48px;
  }
  .kicker {
    font-size: 12px; letter-spacing: 0.28em; color: var(--sage-deep);
    margin-bottom: 16px; font-weight: 500;
  }
  .hero h1 {
    font-family: "Noto Serif TC", serif;
    font-size: clamp(28px, 4vw, 40px);
    font-weight: 700; letter-spacing: 0.14em; line-height: 1.35;
    margin-bottom: 16px;
  }
  .hero .lead {
    font-size: 15px; font-weight: 300; color: var(--ink-soft);
    max-width: 28em; line-height: 1.9; margin-bottom: 28px;
  }
  .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 12px 22px; font-size: 13px; letter-spacing: 0.14em;
    border: 1px solid transparent; cursor: pointer; transition: .18s;
  }
  .btn-sage { background: var(--sage); color: var(--white); border-color: var(--sage); }
  .btn-sage:hover { background: var(--sage-deep); }
  .btn-line { border-color: var(--sand); color: var(--ink); background: transparent; }
  .btn-line:hover { border-color: var(--clay); color: var(--seal); }
  .btn-ghost { color: var(--sage-deep); border-bottom: 1px solid var(--sage); padding: 10px 2px; border-radius: 0; }
  .hero-meta { margin-top: 22px; font-size: 13px; color: var(--ink-soft); letter-spacing: 0.06em; }
  .hero-photo {
    border: 1px solid var(--sand);
    background: var(--white);
    padding: 8px;
  }
  .hero-photo img { display: block; width: 100%; height: auto; aspect-ratio: 4/3; object-fit: cover; }
  .hero-photo .cap {
    margin-top: 8px; font-size: 12px; letter-spacing: 0.14em; color: var(--ink-soft);
    display: flex; justify-content: space-between;
  }

  section.block { padding: 88px 0; position: relative; z-index: 1; }
  section.tint { background: rgba(235, 228, 216, 0.45); }
  .sec-label {
    font-size: 12px; letter-spacing: 0.28em; color: var(--sage-deep);
    margin-bottom: 12px; font-weight: 500;
  }
  .sec-title {
    font-family: "Noto Serif TC", serif;
    font-size: clamp(24px, 3.5vw, 32px);
    font-weight: 600; letter-spacing: 0.16em;
    margin-bottom: 14px;
  }
  .sec-lead {
    font-size: 15px; font-weight: 300; color: var(--ink-soft);
    max-width: 36em; line-height: 1.9; margin-bottom: 36px;
  }
  .divider {
    width: 48px; height: 2px; background: var(--clay); margin: 0 0 28px;
  }

  .brand-grid {
    display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 48px; align-items: start;
  }
  .brand-notes { display: grid; gap: 18px; }
  .note {
    padding: 20px 22px; border-left: 3px solid var(--sage);
    background: var(--white);
  }
  .note h3 {
    font-family: "Noto Serif TC", serif;
    font-size: 16px; letter-spacing: 0.12em; margin-bottom: 8px; color: var(--ink);
  }
  .note p { font-size: 14px; font-weight: 300; color: var(--ink-soft); }

  .space-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
  }
  .space-card {
    background: var(--white); border: 1px solid var(--sand); padding: 10px;
  }
  .space-card:nth-child(2) { margin-top: 28px; }
  .space-card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
  .space-card .cap {
    margin-top: 10px; padding: 0 4px 6px;
    font-family: "Noto Serif TC", serif;
    font-size: 14px; letter-spacing: 0.14em;
  }
  .space-card .cap span {
    display: block; font-family: "Noto Sans TC", "Noto Sans JP", "Noto Sans KR", sans-serif;
    font-size: 12px; font-weight: 300; color: var(--ink-soft);
    letter-spacing: 0.06em; margin-top: 4px;
  }

  .sig-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  a.sig-card {
    background: var(--white); border: 1px solid var(--sand);
    display: block; transition: border-color .18s, box-shadow .18s, transform .18s;
  }
  a.sig-card:hover {
    border-color: var(--sage);
    box-shadow: 0 8px 24px rgba(42, 38, 34, 0.08);
    transform: translateY(-2px);
  }
  .sig-card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
  .sig-body { padding: 18px 20px 22px; display: flex; justify-content: space-between; align-items: end; gap: 12px; }
  .sig-name { font-family: "Noto Serif TC", serif; font-size: 22px; letter-spacing: 0.12em; }
  .sig-sub { font-size: 13px; color: var(--ink-soft); margin-top: 4px; letter-spacing: 0.08em; }
  .sig-price { font-family: "Noto Serif TC", serif; font-size: 20px; color: var(--seal); }
  .sig-about { font-size: 12px; color: var(--sage-deep); letter-spacing: 0.06em; margin-top: 8px; }

  .menu-highlight {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 20px;
    align-items: center;
    background: var(--white);
    border: 1px solid var(--sand);
    padding: 12px;
    margin-bottom: 20px;
    transition: border-color .18s, box-shadow .18s;
  }
  a.menu-highlight:hover {
    border-color: var(--sage);
    box-shadow: 0 6px 20px rgba(42, 38, 34, 0.07);
  }
  .menu-highlight img {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    display: block;
  }
  .menu-highlight .mh-name {
    font-family: "Noto Serif TC", serif;
    font-size: 22px;
    letter-spacing: 0.12em;
  }
  .menu-highlight .mh-sub { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
  .menu-highlight .mh-price { font-family: "Noto Serif TC", serif; color: var(--seal); font-size: 20px; margin-top: 10px; }
  .menu-highlight .mh-about { font-size: 12px; color: var(--sage-deep); margin-top: 8px; letter-spacing: 0.06em; }
  @media (max-width: 820px) {
    .menu-highlight { grid-template-columns: 1fr; }
  }

  .menu-panel {
    background: var(--white);
    border: 1px solid var(--sand);
    padding: 36px 32px;
  }
  .menu-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 48px; }
  .menu-cat {
    font-family: "Noto Serif TC", serif;
    font-size: 14px; letter-spacing: 0.24em; color: var(--sage-deep);
    margin: 26px 0 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .menu-cols > div > .menu-cat:first-child { margin-top: 0; }
  a.menu-row {
    display: grid; grid-template-columns: 1fr auto auto; gap: 12px;
    padding: 12px 8px; margin: 0 -8px; border-bottom: 1px dotted var(--line); align-items: baseline;
    border-radius: 2px; transition: background .15s, color .15s;
  }
  a.menu-row:last-child { border-bottom: none; }
  a.menu-row:hover {
    background: rgba(122, 144, 132, 0.1);
  }
  a.menu-row:hover .m-about { color: var(--sage-deep); }
  .m-name { font-family: "Noto Serif TC", serif; font-size: 16px; letter-spacing: 0.08em; }
  .m-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .m-price { font-size: 15px; color: var(--ink); font-weight: 500; }
  .m-about {
    font-size: 11px; color: var(--ink-soft); letter-spacing: 0.04em;
    white-space: nowrap; align-self: center;
  }

  .take-grid {
    display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 24px; margin-bottom: 28px;
  }
  .take-grid .space-card:nth-child(2) { margin-top: 0; }
  .take-points {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
  }
  .point {
    background: var(--white); border: 1px solid var(--sand); padding: 22px 18px;
  }
  .point h3 {
    font-family: "Noto Serif TC", serif; font-size: 15px; letter-spacing: 0.1em;
    color: var(--sage-deep); margin-bottom: 8px;
  }
  .point p, .point li { font-size: 13px; font-weight: 300; color: var(--ink-soft); line-height: 1.75; }
  .point ul { padding-left: 1em; }

  .loc-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    border: 1px solid var(--sand); background: var(--white);
  }
  .loc-grid > div { padding: 36px 32px; }
  .loc-grid > div:first-child {
    border-right: 1px solid var(--line);
    background: rgba(122, 144, 132, 0.08);
  }
  .addr {
    font-family: "Noto Serif TC", serif; font-size: 18px; letter-spacing: 0.08em;
    margin: 12px 0 8px;
  }
  .hint { font-size: 13px; color: var(--ink-soft); }
  .pill {
    display: inline-block; margin-top: 18px;
    font-size: 11px; letter-spacing: 0.2em; color: var(--seal);
    border: 1px solid var(--clay); padding: 6px 12px;
  }
  form.notify { display: grid; gap: 12px; margin-top: 8px; }
  form.notify label { font-size: 12px; letter-spacing: 0.14em; color: var(--ink-soft); }
  form.notify input {
    width: 100%; border: none; border-bottom: 1px solid var(--line);
    background: transparent; padding: 12px 0; font-size: 15px; font-family: inherit; outline: none;
  }
  form.notify input:focus { border-bottom-color: var(--sage); }
  form.notify button { margin-top: 6px; }
  .form-note { font-size: 11px; color: var(--ink-soft); }

  footer {
    position: relative; z-index: 1;
    border-top: 1px solid var(--line);
    padding: 40px 0 56px; text-align: center;
  }
  .footer-logo { height: 42px; width: auto; max-width: 260px; margin: 0 auto 14px; display: block; }
  footer p { font-size: 12px; color: var(--ink-soft); letter-spacing: 0.1em; }

  @media (max-width: 820px) {
    .nav-links { display: none; }
    .hero-grid, .brand-grid, .space-grid, .sig-grid, .menu-cols, .take-grid, .loc-grid, .take-points {
      grid-template-columns: 1fr;
    }
    .space-card:nth-child(2) { margin-top: 0; }
    .loc-grid > div:first-child { border-right: none; border-bottom: 1px solid var(--line); }
    section.block { padding: 64px 0; }
    a.menu-row { grid-template-columns: 1fr auto; }
    .m-about { display: none; }
  }
</style>
</head>
<body>
  <header class="site" id="siteHeader">
    <div class="wrap nav">
      <a href="#top"><img class="nav-logo" src="brand/logo-soft-color.png" alt="平日食器" /></a>
      <div class="nav-right">
        <nav class="nav-links" id="navLinks" aria-label="主要"></nav>
        <div class="langs" id="langs" role="group" aria-label="Language"></div>
        <a class="nav-cta" id="navCta" href="#menu">看菜單</a>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="wrap hero-grid">
        <div>
          <p class="kicker" id="kicker">平日食器</p>
          <h1 id="heroTitle">平日快速的台式×日式新定食</h1>
          <p class="lead" id="heroLead"></p>
          <div class="hero-actions">
            <a class="btn btn-sage" id="ctaMenu" href="#menu">看菜單</a>
            <a class="btn btn-line" id="ctaTakeout" href="#takeout">外帶說明</a>
            <a class="btn btn-ghost" id="ctaLoc" href="#location">地點</a>
          </div>
          <p class="hero-meta" id="heroMeta"></p>
        </div>
        <figure class="hero-photo">
          <img src="brand/store-exterior.png" alt="平日食器店面外觀" id="heroImg" />
          <figcaption class="cap"><span id="heroCapL">店景</span><span id="heroCapR">裝潢後外觀</span></figcaption>
        </figure>
      </div>
    </section>

    <section class="block tint" id="brand">
      <div class="wrap brand-grid">
        <div>
          <p class="sec-label" id="brandLabel">品牌</p>
          <h2 class="sec-title" id="brandTitle">關於平日食器</h2>
          <div class="divider"></div>
          <p class="sec-lead" id="brandLead" style="margin-bottom:0"></p>
        </div>
        <div class="brand-notes">
          <div class="note">
            <h3 id="note1Title"></h3>
            <p id="note1Body"></p>
          </div>
          <div class="note">
            <h3 id="note2Title"></h3>
            <p id="note2Body"></p>
          </div>
        </div>
      </div>
    </section>

    <section class="block" id="space">
      <div class="wrap">
        <p class="sec-label" id="spaceLabel">店景</p>
        <h2 class="sec-title" id="spaceTitle">空間與氛圍</h2>
        <div class="divider"></div>
        <p class="sec-lead" id="spaceLead"></p>
        <div class="space-grid">
          <figure class="space-card">
            <img src="brand/store-exterior.png" alt="" id="spaceExtImg" />
            <figcaption class="cap" id="spaceExtCap"></figcaption>
          </figure>
          <figure class="space-card">
            <img src="brand/store-interior.png" alt="" id="spaceIntImg" />
            <figcaption class="cap" id="spaceIntCap"></figcaption>
          </figure>
        </div>
      </div>
    </section>

    <section class="block tint" id="sig">
      <div class="wrap">
        <p class="sec-label" id="sigLabel">招牌</p>
        <h2 class="sec-title" id="sigTitle">先記住兩道</h2>
        <div class="divider"></div>
        <p class="sec-lead" id="sigLead"></p>
        <div class="sig-grid" id="sigGrid"></div>
      </div>
    </section>

    <section class="block" id="menu">
      <div class="wrap">
        <p class="sec-label" id="menuLabel">菜單</p>
        <h2 class="sec-title" id="menuTitle">完整菜單</h2>
        <div class="divider"></div>
        <p class="sec-lead" id="menuLead"></p>
        <div id="menuHighlight"></div>
        <div class="menu-panel">
          <div class="menu-cols" id="menuCols"></div>
        </div>
      </div>
    </section>

    <section class="block tint" id="takeout">
      <div class="wrap">
        <p class="sec-label" id="takeLabel">外帶</p>
        <h2 class="sec-title" id="takeTitle">平日外帶</h2>
        <div class="divider"></div>
        <p class="sec-lead" id="takeLead"></p>
        <div class="take-grid" id="takeGrid"></div>
        <div class="take-points">
          <div class="point"><h3 id="takePt1Title"></h3><p id="takePt1Body"></p></div>
          <div class="point"><h3 id="takePt2Title"></h3><ul id="takePt2List"></ul></div>
          <div class="point"><h3 id="takePt3Title"></h3><p id="takePt3Body"></p></div>
        </div>
      </div>
    </section>

    <section class="block" id="location">
      <div class="wrap">
        <p class="sec-label" id="locLabel">地點</p>
        <h2 class="sec-title" id="locTitle">來店與開幕通知</h2>
        <div class="divider"></div>
        <div class="loc-grid">
          <div>
            <p class="addr" id="locAddr"></p>
            <p class="hint" id="locHint"></p>
            <span class="pill" id="locPill"></span>
          </div>
          <div>
            <p class="sec-lead" id="locFormLead" style="margin-bottom:12px"></p>
            <form class="notify" id="notifyForm">
              <div>
                <label for="email" id="emailLabel">信箱</label>
                <input id="email" type="email" placeholder="you@example.com" required />
              </div>
              <button class="btn btn-sage" type="submit" id="notifyBtn"></button>
              <p class="form-note" id="formNote"></p>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <img class="footer-logo" src="brand/logo-soft-color.png" alt="平日食器" />
      <p id="footerLine"></p>
      <p style="margin-top:8px">pingrishiqiu.com</p>
    </div>
  </footer>
  <script src="dishes/dishes-data.js"></script>
  <script>
const LANGS = [
  { code: "zh", label: "中文" },
  { code: "en", label: "EN" },
  { code: "ja", label: "日本語" },
  { code: "ko", label: "한국어" }
];

function readLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && PINGRI_HOME[q]) return q;
  const stored = localStorage.getItem("pingri_lang");
  if (stored && PINGRI_HOME[stored]) return stored;
  return "zh";
}

let lang = readLang();

function home() { return PINGRI_HOME[lang]; }
function dishUi() { return PINGRI_I18N[lang]; }
function L(d) { return d[lang] || d.zh; }

function dishHref(id) {
  return "dishes/index.html?lang=" + encodeURIComponent(lang) + "#" + id;
}

function syncUrl(replace) {
  const u = new URL(location.href);
  u.searchParams.set("lang", lang);
  const hash = location.hash || "";
  const next = u.pathname + "?" + u.searchParams.toString() + hash;
  if (replace) history.replaceState(null, "", next);
  else history.pushState(null, "", next);
}

function byId(id) { return PINGRI_DISHES.find(d => d.id === id); }

function setText(id, text) {
  const el = document.getElementById(id);
  if (el) el.textContent = text;
}

function renderLangs() {
  document.getElementById("langs").innerHTML = LANGS.map(l =>
    `<button type="button" data-lang="${l.code}" class="${l.code===lang?"on":""}">${l.label}</button>`
  ).join("");
}

function renderNav() {
  const h = home();
  const nav = document.getElementById("navLinks");
  nav.setAttribute("aria-label", h.navAria);
  nav.innerHTML = [
    ["#brand", h.nav.brand],
    ["#space", h.nav.space],
    ["#sig", h.nav.sig],
    ["#menu", h.nav.menu],
    ["dishes/index.html?lang=" + encodeURIComponent(lang), h.nav.dishes],
    ["#takeout", h.nav.takeout],
    ["#location", h.nav.location]
  ].map(([href, label]) => `<a href="${href}">${label}</a>`).join("");
  setText("navCta", h.ctaMenu);
}

function renderSig() {
  const about = dishUi().aboutDish;
  const ids = ["taxiang", "weixi"];
  document.getElementById("sigGrid").innerHTML = ids.map(id => {
    const d = byId(id);
    const x = L(d);
    const img = d.image.replace(/^\.\.\//, "");
    return `<a class="sig-card" href="${dishHref(id)}">
      <img src="${img}" alt="${x.name}｜${x.sub}" />
      <div class="sig-body">
        <div>
          <div class="sig-name">${x.name}</div>
          <div class="sig-sub">${x.sub}</div>
          <div class="sig-about">${about}</div>
        </div>
        <div class="sig-price">$${d.price}</div>
      </div>
    </a>`;
  }).join("");
}

function renderHighlight() {
  const h = home();
  const about = dishUi().aboutDish;
  const d = byId("hongshao");
  const x = L(d);
  const img = d.image.replace(/^\.\.\//, "");
  document.getElementById("menuHighlight").innerHTML =
    `<a class="menu-highlight" href="${dishHref("hongshao")}">
      <img src="${img}" alt="${x.name}｜${x.sub}" />
      <div>
        <div class="mh-name">${x.name}</div>
        <div class="mh-sub">${x.sub}${h.mhExtra}</div>
        <div class="mh-price">$${d.price}</div>
        <div class="mh-about">${about}</div>
      </div>
    </a>`;
}

function menuRow(d) {
  const x = L(d);
  const about = dishUi().aboutDish;
  return `<a class="menu-row" href="${dishHref(d.id)}">
    <div><div class="m-name">${x.name}</div><div class="m-sub">${x.sub}</div></div>
    <div class="m-about">${about}</div>
    <div class="m-price">${d.price}</div>
  </a>`;
}

function renderMenu() {
  const catsUi = dishUi().cats;
  const leftOrder = ["don", "noodle"];
  const rightOrder = ["soup", "side", "bento"];
  function col(order) {
    return order.map(cat => {
      const dishes = PINGRI_DISHES.filter(d => d.cat === cat);
      if (!dishes.length) return "";
      return `<h3 class="menu-cat">${catsUi[cat]}</h3>` + dishes.map(menuRow).join("");
    }).join("");
  }
  document.getElementById("menuCols").innerHTML =
    `<div>${col(leftOrder)}</div><div>${col(rightOrder)}</div>`;
}

function renderTakeGrid() {
  const items = [
    ["bento-lurou", true],
    ["congian", false],
    ["hongshao", true]
  ];
  // take-grid was 2-col originally with 3 cards — keep 3 cards
  document.getElementById("takeGrid").innerHTML = items.map(([id]) => {
    const d = byId(id);
    const x = L(d);
    const img = d.image.replace(/^\.\.\//, "");
    return `<figure class="space-card">
      <img src="${img}" alt="${x.name}｜${x.sub}" />
      <figcaption class="cap">${x.name}・${x.sub}<span>$${d.price}</span></figcaption>
    </figure>`;
  }).join("");

  const h = home();
  const bl = byId("bento-lurou");
  const bs = byId("bento-shaorou");
  const hs = byId("hongshao");
  const join = lang === "en" ? " " : "・";
  document.getElementById("takePt2List").innerHTML = [
    `<li>${L(bl).name}${join}${L(bl).sub} $${bl.price}</li>`,
    `<li>${L(bs).name}${join}${L(bs).sub} $${bs.price}</li>`,
    `<li>${L(hs).name}${join}${L(hs).sub} $${hs.price}</li>`
  ].join("");
}

function render() {
  const h = home();
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : lang;
  document.title = h.title;
  document.getElementById("metaDesc").setAttribute("content", h.description);
  localStorage.setItem("pingri_lang", lang);

  renderLangs();
  renderNav();

  setText("kicker", h.kicker);
  setText("heroTitle", h.heroTitle);
  setText("heroLead", h.heroLead);
  setText("ctaMenu", h.ctaMenu);
  setText("ctaTakeout", h.ctaTakeout);
  setText("ctaLoc", h.ctaLoc);
  setText("heroMeta", h.heroMeta);
  setText("heroCapL", h.heroCapL);
  setText("heroCapR", h.heroCapR);

  setText("brandLabel", h.brandLabel);
  setText("brandTitle", h.brandTitle);
  setText("brandLead", h.brandLead);
  setText("note1Title", h.note1Title);
  setText("note1Body", h.note1Body);
  setText("note2Title", h.note2Title);
  setText("note2Body", h.note2Body);

  setText("spaceLabel", h.spaceLabel);
  setText("spaceTitle", h.spaceTitle);
  setText("spaceLead", h.spaceLead);
  document.getElementById("spaceExtImg").alt = h.spaceExt;
  document.getElementById("spaceIntImg").alt = h.spaceInt;
  document.getElementById("spaceExtCap").innerHTML = `${h.spaceExt}<span>${h.spaceExtSub}</span>`;
  document.getElementById("spaceIntCap").innerHTML = `${h.spaceInt}<span>${h.spaceIntSub}</span>`;

  setText("sigLabel", h.sigLabel);
  setText("sigTitle", h.sigTitle);
  setText("sigLead", h.sigLead);
  renderSig();

  setText("menuLabel", h.menuLabel);
  setText("menuTitle", h.menuTitle);
  const lead = document.getElementById("menuLead");
  lead.innerHTML = h.menuLeadBefore +
    `<a href="dishes/index.html?lang=${encodeURIComponent(lang)}" style="color:var(--sage-deep);border-bottom:1px solid var(--sage)">${h.menuLeadLink}</a>` +
    h.menuLeadAfter;
  renderHighlight();
  renderMenu();

  setText("takeLabel", h.takeLabel);
  setText("takeTitle", h.takeTitle);
  setText("takeLead", h.takeLead);
  setText("takePt1Title", h.takePt1Title);
  setText("takePt1Body", h.takePt1Body);
  setText("takePt2Title", h.takePt2Title);
  setText("takePt3Title", h.takePt3Title);
  setText("takePt3Body", h.takePt3Body);
  renderTakeGrid();

  setText("locLabel", h.locLabel);
  setText("locTitle", h.locTitle);
  setText("locAddr", h.locAddr);
  setText("locHint", h.locHint);
  setText("locPill", h.locPill);
  setText("locFormLead", h.locFormLead);
  setText("emailLabel", h.emailLabel);
  setText("notifyBtn", h.notifyBtn);
  setText("formNote", h.formNote);
  setText("footerLine", h.footerLine);
}

document.getElementById("langs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-lang]");
  if (!b) return;
  lang = b.dataset.lang;
  localStorage.setItem("pingri_lang", lang);
  syncUrl(false);
  render();
});

window.addEventListener("popstate", () => {
  lang = readLang();
  render();
});

document.getElementById("notifyForm").addEventListener("submit", (e) => {
  e.preventDefault();
  document.getElementById("formNote").textContent = home().formDone;
});

const headerEl = document.getElementById("siteHeader");
const onScroll = () => headerEl.classList.toggle("on", scrollY > 6);
onScroll();
addEventListener("scroll", onScroll, { passive: true });

syncUrl(true);
render();
  </script>
</body>
</html>
